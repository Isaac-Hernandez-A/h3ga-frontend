name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm generate
        env:
          NUXT_PUBLIC_API_BASE: https://h3ga-backend-2bbfj.ondigitalocean.app/api/v1
